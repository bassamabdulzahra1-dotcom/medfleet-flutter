# MedFleet Flutter — Codemagic CI/CD
# Bundle ID: net.medfleet.rep

workflows:
  ios-ipa:
    name: MedFleet — IPA (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: medfleet-apple

    environment:
      flutter: stable
      xcode: 26.6
      cocoapods: default
      groups:
        - ios_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.medfleet.rep

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=${BUILD_NUMBER:-1} \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - bassamabdulzahra1@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
